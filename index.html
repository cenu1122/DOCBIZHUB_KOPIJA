<!DOCTYPE html>
<html lang="bs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DocBizHub | Business Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --navy:#0b1730;
    --navy2:#12264a;
    --blue:#3155ff;
    --blue2:#6d7cff;
    --ink:#13213b;
    --muted:#667085;
    --bg:#f5f7fb;
    --card:#fff;
    --line:#e7ebf3;
    --green:#18a66b;
    --shadow:0 18px 50px rgba(20,39,76,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font:inherit;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(11,23,48,.94);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.1);
    padding:14px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}

.logo{
    color:#fff;
    font-weight:900;
    font-size:1.28rem;
    letter-spacing:-.4px;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-mark{
    width:36px;
    height:36px;
    border-radius:11px;
    background:linear-gradient(135deg,#6d7cff,#3155ff);
    display:grid;
    place-items:center;
    box-shadow:0 8px 22px rgba(49,85,255,.35);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
}

.btn-nav{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    color:#fff;
    padding:9px 14px;
    border-radius:12px;
    font-weight:700;
    font-size:.86rem;
    cursor:pointer;
    transition:.2s;
}

.btn-nav:hover{
    background:rgba(255,255,255,.14);
    transform:translateY(-1px);
}

.btn-nav.primary{
    background:var(--blue);
    border-color:var(--blue);
}

.btn-nav.logout{
    background:rgba(255,255,255,.04);
}

.lang-wrapper{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border-radius:12px;
    padding:3px 9px;
}

.lang-wrapper span{
    font-size:.9rem;
}

#google_translate_element select{
    border:0;
    background:#fff;
    color:var(--ink);
    font-weight:700;
    outline:0;
    font-size:.78rem;
    padding:5px 2px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main-container{
    max-width:1240px;
    width:92%;
    margin:0 auto;
    padding:32px 0 60px;
    display:flex;
    flex-direction:column;
    gap:28px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    border-radius:30px;
    background:linear-gradient(
        120deg,
        #0b1730 0%,
        #132b56 55%,
        #294bd1 100%
    );
    color:#fff;
    padding:48px;
    min-height:430px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:35px;
    box-shadow:0 25px 65px rgba(11,23,48,.2);
}

.hero:before{
    content:"";
    position:absolute;
    width:430px;
    height:430px;
    border-radius:50%;
    right:-170px;
    top:-210px;
    background:rgba(109,124,255,.2);
    filter:blur(3px);
}

.hero:after{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    left:-120px;
    bottom:-180px;
    background:rgba(49,85,255,.25);
}

.hero-content,
.hero-visual{
    position:relative;
    z-index:1;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);
    border-radius:999px;
    font-size:.76rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(2.25rem,5vw,4.35rem);
    line-height:1.02;
    letter-spacing:-2.5px;
    max-width:680px;
    margin-bottom:18px;
}

.hero h1 span{
    color:#9eabff;
}

.hero p{
    font-size:1.05rem;
    line-height:1.7;
    color:#dbe4ff;
    max-width:640px;
}

.hero-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:26px;
}

.hero-btn{
    padding:13px 18px;
    border-radius:13px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:9px;
    border:1px solid rgba(255,255,255,.16);
    transition:.2s;
}

.hero-btn:hover{
    transform:translateY(-2px);
}

.hero-btn.primary{
    background:#fff;
    color:var(--navy);
}

.hero-btn.secondary{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.user-badge{
    display:inline-flex;
    margin-top:18px;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.13);
    font-size:.78rem;
    color:#dfe6ff;
}

/* =========================================================
   HERO VISUAL
   ========================================================= */

.hero-visual{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.18);
    transform:rotate(1deg);
}

.mock-top{
    height:28px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 4px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
}

.mock-body{
    background:#f7f9ff;
    border-radius:15px;
    padding:16px;
    color:var(--ink);
}

.mock-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-bottom:15px;
}

.mock-title{
    font-weight:900;
}

.mock-pill{
    font-size:.7rem;
    background:#e8edff;
    color:var(--blue);
    padding:6px 8px;
    border-radius:8px;
    font-weight:800;
}

.mock-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:10px;
}

.mock-card{
    background:#fff;
    border:1px solid #edf0f6;
    border-radius:12px;
    padding:13px;
    box-shadow:0 5px 15px rgba(20,39,76,.05);
}

.mock-card strong{
    display:block;
    font-size:.95rem;
    margin-bottom:6px;
}

.mock-card small{
    color:var(--muted);
    font-size:.72rem;
}

.mock-chart{
    height:92px;
    margin-top:10px;
    display:flex;
    align-items:flex-end;
    gap:6px;
}

.bar{
    flex:1;
    background:linear-gradient(180deg,#6d7cff,#3155ff);
    border-radius:6px 6px 2px 2px;
}

.mock-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.mock-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.74rem;
    font-weight:700;
}

.mini-icon{
    width:25px;
    height:25px;
    border-radius:8px;
    background:#eef1ff;
    display:grid;
    place-items:center;
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.stat{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 28px rgba(20,39,76,.05);
}

.stat strong{
    font-size:1.55rem;
    display:block;
    letter-spacing:-.5px;
}

.stat span{
    display:block;
    color:var(--muted);
    font-size:.8rem;
    margin-top:5px;
    font-weight:700;
}

.stat-icon{
    float:right;
    width:34px;
    height:34px;
    border-radius:10px;
    background:#edf1ff;
    display:grid;
    place-items:center;
}

/* =========================================================
   SECTION HEAD
   ========================================================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-top:8px;
}

.section-head h2{
    font-size:1.75rem;
    letter-spacing:-.8px;
}

.section-head p{
    color:var(--muted);
    font-size:.92rem;
    margin-top:5px;
}

.section-kicker{
    font-size:.72rem;
    color:var(--blue);
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-bottom:7px;
}

/* =========================================================
   CATEGORIES
   ========================================================= */

.category{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.category-title{
    font-size:.78rem;
    font-weight:900;
    color:#667085;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.dash-tile{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:21px;
    min-height:178px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:11px;
    transition:.22s;
    box-shadow:0 8px 25px rgba(20,39,76,.045);
    cursor:pointer;
}

.dash-tile:hover{
    transform:translateY(-5px);
    border-color:#c9d1ff;
    box-shadow:0 18px 35px rgba(49,85,255,.12);
}

.tile-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#eef1ff;
    color:var(--blue);
    display:grid;
    place-items:center;
    font-size:1.3rem;
    font-weight:900;
}

.dash-tile h3{
    font-size:1rem;
    letter-spacing:-.2px;
}

.dash-tile p{
    font-size:.78rem;
    line-height:1.5;
    color:var(--muted);
}

.tile-arrow{
    margin-top:auto;
    color:var(--blue);
    font-size:.76rem;
    font-weight:900;
}

.admin-only{
    display:none;
}

.mail-actions{
    display:flex;
    gap:7px;
    width:100%;
    margin-top:auto;
}

.mail-btn{
    flex:1;
    padding:8px;
    border-radius:9px;
    text-align:center;
    font-size:.72rem;
    font-weight:900;
}

.mail-btn.gen{
    background:var(--blue);
    color:#fff;
}

.mail-btn.inbox{
    background:#e8f8f1;
    color:#087c4f;
}

/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

.search-section{
    background:linear-gradient(135deg,#3155ff,#6d7cff);
    color:#fff;
    border-radius:25px;
    padding:30px;
    box-shadow:0 18px 45px rgba(49,85,255,.2);
}

.search-top{
    display:flex;
    justify-content:space-between;
    align-items:start;
    gap:20px;
}

.search-section h2{
    font-size:1.55rem;
    letter-spacing:-.5px;
}

.search-section p{
    color:#e7ebff;
    font-size:.9rem;
    margin-top:5px;
}

.search-box{
    display:flex;
    gap:8px;
    background:#fff;
    padding:7px;
    border-radius:15px;
    margin-top:20px;
}

.search-box input{
    flex:1;
    border:0;
    outline:0;
    padding:12px 13px;
    color:var(--ink);
    background:transparent;
}

.search-box button{
    border:0;
    background:var(--navy);
    color:#fff;
    padding:0 18px;
    border-radius:11px;
    font-weight:800;
    cursor:pointer;
}

.quick-links{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.quick-links button{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.1);
    color:#fff;
    padding:7px 10px;
    border-radius:999px;
    font-size:.73rem;
    cursor:pointer;
}

.quick-links button:hover{
    background:rgba(255,255,255,.18);
}

#searchStatus{
    margin-top:12px;
    font-size:.82rem;
}

#searchResults{
    display:none;
    flex-direction:column;
    gap:10px;
    margin-top:13px;
}

.search-result{
    background:#fff;
    color:var(--ink);
    padding:14px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.result-left{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.result-icon{
    font-size:1.3rem;
}

.result-title{
    font-weight:800;
    font-size:.9rem;
}

.result-description{
    font-size:.76rem;
    color:var(--muted);
    margin-top:3px;
}

.result-source{
    font-size:.68rem;
    background:#eef1ff;
    color:var(--blue);
    padding:5px 8px;
    border-radius:8px;
    font-weight:800;
}

/* =========================================================
   HOW IT WORKS
   ========================================================= */

.how-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.step{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
    box-shadow:0 8px 25px rgba(20,39,76,.04);
}

.step-num{
    width:34px;
    height:34px;
    border-radius:10px;
    background:var(--navy);
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:900;
    margin-bottom:16px;
}

.step h3{
    font-size:1rem;
    margin-bottom:7px;
}

.step p{
    color:var(--muted);
    font-size:.8rem;
    line-height:1.6;
}

/* =========================================================
   AUDIENCE
   ========================================================= */

.audience{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.audience-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
}

.audience-card strong{
    display:block;
    margin:11px 0 6px;
}

.audience-card p{
    font-size:.78rem;
    color:var(--muted);
    line-height:1.55;
}

.audience-icon{
    font-size:1.5rem;
}

/* =========================================================
   VIDEO
   ========================================================= */

.video-section{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px;
    box-shadow:0 8px 25px rgba(20,39,76,.04);
}

.video-heading{
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:end;
    margin-bottom:16px;
}

.video-heading h2{
    font-size:1.45rem;
}

.video-heading p{
    font-size:.82rem;
    color:var(--muted);
}

.video-container{
    position:relative;
    width:100%;
    padding-bottom:50%;
    height:0;
    border-radius:16px;
    overflow:hidden;
    background:#0b1730;
}

.video-container iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
}

/* =========================================================
   FINAL CTA
   ========================================================= */

.final-cta{
    background:linear-gradient(135deg,#0b1730,#18376f);
    color:#fff;
    border-radius:24px;
    padding:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.final-cta h2{
    font-size:1.8rem;
    letter-spacing:-.7px;
}

.final-cta p{
    color:#d5def5;
    font-size:.85rem;
    margin-top:6px;
}

.final-cta a{
    background:#fff;
    color:var(--navy);
    padding:12px 17px;
    border-radius:12px;
    font-weight:900;
    white-space:nowrap;
}

/* =========================================================
   STANDARD MODAL
   ========================================================= */

.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(5,12,26,.72);
    z-index:1000;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modal-overlay.active{
    display:flex;
}

.modal-content{
    background:#fff;
    width:100%;
    max-width:700px;
    padding:28px;
    border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:15px;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
}

.btn-close-modal{
    background:#f0f2f6;
    color:var(--ink);
    border:0;
    width:35px;
    height:35px;
    border-radius:10px;
    font-weight:900;
    cursor:pointer;
}

.modal-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.modal-grid .dash-tile{
    min-height:150px;
}

/* =========================================================
   ADMIN NOTIFICATION
   ========================================================= */

#adminNotificationOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:999999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#adminNotificationOverlay.active{
    display:flex;
}

#adminNotificationBox{
    width:min(900px,95vw);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:24px;
    padding:35px;
    text-align:center;
    border-top:8px solid #d90429;
}

#adminNotificationBox h1{
    color:#d90429;
    font-size:clamp(1.7rem,4vw,3rem);
    margin-bottom:12px;
}

.admin-notification-type{
    font-size:1.2rem;
    font-weight:900;
    margin-bottom:20px;
}

.admin-notification-data{
    background:#f5f7fb;
    border-radius:15px;
    padding:18px;
    text-align:left;
    margin-bottom:20px;
}

.admin-notification-row{
    padding:10px 4px;
    border-bottom:1px solid #ddd;
    font-size:.95rem;
    word-break:break-word;
}

.admin-notification-label{
    font-weight:900;
    margin-right:7px;
}

#adminNotificationConfirm{
    background:#d90429;
    color:#fff;
    border:0;
    border-radius:11px;
    padding:13px 30px;
    font-weight:900;
    cursor:pointer;
}

/* =========================================================
   FORUM TOAST
   ========================================================= */

#forumToast{
    display:none;
    position:fixed;
    bottom:20px;
    right:20px;
    background:var(--navy);
    color:#fff;
    padding:14px 18px;
    border-radius:13px;
    z-index:99999;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    border-left:4px solid var(--blue);
    max-width:320px;
    flex-direction:column;
    gap:4px;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
    background:var(--navy);
    color:#aebbd7;
    text-align:center;
    padding:25px 0;
    font-size:.78rem;
}

/* =========================================================
   DOCBIZ AI
   ========================================================= */

#docbiz-ai{
    position:fixed;
    right:20px;
    bottom:20px;
    width:min(390px,calc(100vw - 30px));
    height:600px;
    max-height:calc(100vh - 40px);
    background:#fff;
    border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
    z-index:99998;
    display:none;
    overflow:hidden;
    border:1px solid var(--line);
}

#docbiz-ai.open{
    display:flex;
}

#docbiz-ai-open{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:linear-gradient(135deg,#3155ff,#6d7cff);
    color:#fff;
    font-size:1.35rem;
    cursor:pointer;
    z-index:99997;
    box-shadow:0 15px 35px rgba(49,85,255,.3);
}

#docbiz-ai.open + #docbiz-ai-open{
    display:none;
}

/* =========================================================
   MOJ DOCBIZHUB
   ========================================================= */

.my-dashboard-section{
    background:#fff;
    border:1px solid var(--line);
    border-radius:24px;
    padding:28px;
    box-shadow:0 10px 30px rgba(20,39,76,.05);
}

.my-dashboard-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
}

.my-dashboard-title{
    display:flex;
    align-items:center;
    gap:12px;
}

.my-dashboard-title-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#eef1ff;
    display:grid;
    place-items:center;
    font-size:1.35rem;
}

.my-dashboard-title h2{
    font-size:1.55rem;
    letter-spacing:-.6px;
}

.my-dashboard-title p{
    color:var(--muted);
    font-size:.82rem;
    margin-top:4px;
}

.my-dashboard-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.my-dashboard-btn{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    padding:10px 14px;
    border-radius:11px;
    font-weight:800;
    font-size:.78rem;
    cursor:pointer;
}

.my-dashboard-btn.primary{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
}

.my-dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.my-function-card{
    position:relative;
    background:#f9faff;
    border:1px solid #e5e9f4;
    border-radius:18px;
    padding:20px;
    min-height:170px;
    display:flex;
    flex-direction:column;
    transition:.2s;
    cursor:grab;
}

.my-function-card:hover{
    transform:translateY(-3px);
    border-color:#c9d1ff;
    box-shadow:0 15px 30px rgba(49,85,255,.10);
}

.my-function-card.docbiz-dragging{
    opacity:.45;
    transform:scale(.98);
}

.my-function-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#eef1ff;
    display:grid;
    place-items:center;
    font-size:1.3rem;
    margin-bottom:12px;
}

.my-function-card h3{
    font-size:1rem;
    margin-bottom:6px;
}

.my-function-card p{
    color:var(--muted);
    font-size:.76rem;
    line-height:1.5;
}

.my-function-open{
    margin-top:auto;
    color:var(--blue);
    font-size:.76rem;
    font-weight:900;
}

.my-function-remove,
.my-function-move{
    position:absolute;
    top:10px;
    width:28px;
    height:28px;
    border:0;
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    font-weight:900;
}

.my-function-remove{
    right:10px;
    color:#9b1c1c;
}

.my-function-move{
    left:10px;
    color:#667085;
}

.my-empty-dashboard{
    grid-column:1/-1;
    border:2px dashed #dfe4ef;
    border-radius:18px;
    padding:35px;
    text-align:center;
    color:var(--muted);
}

/* =========================================================
   MOJ DOCBIZHUB MODAL
   ========================================================= */

.my-functions-modal{
    position:fixed;
    inset:0;
    background:rgba(5,12,26,.72);
    z-index:10000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.my-functions-modal.active{
    display:flex;
}

.my-functions-box{
    width:min(900px,96vw);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:24px;
    padding:28px;
}

.my-functions-modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.my-functions-close{
    width:36px;
    height:36px;
    border:0;
    border-radius:10px;
    background:#f0f2f6;
    cursor:pointer;
}

.available-functions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.available-function{
    border:1px solid var(--line);
    background:#fff;
    border-radius:15px;
    padding:16px;
    text-align:left;
    cursor:pointer;
}

.available-function:hover{
    border-color:#c9d1ff;
}

.available-function.selected{
    background:#eef1ff;
    border-color:var(--blue);
}

.available-function-icon{
    font-size:1.35rem;
    margin-bottom:8px;
}

.available-function strong{
    display:block;
    font-size:.88rem;
}

.available-function small{
    display:block;
    color:var(--muted);
    font-size:.72rem;
    margin-top:4px;
}

/* =========================================================
   PLACEHOLDER / USKORO
   ========================================================= */

.coming-soon{
    cursor:default;
    position:relative;
}

.coming-soon:hover{
    transform:translateY(-3px);
}

.coming-soon-badge{
    display:inline-flex;
    padding:5px 8px;
    border-radius:999px;
    background:#fff3d6;
    color:#996b00;
    font-size:.65rem;
    font-weight:900;
    margin-top:2px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1000px){

    .hero{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .audience{
        grid-template-columns:repeat(2,1fr);
    }

    .my-dashboard-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .available-functions{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:650px){

    header{
        padding:12px 4%;
    }

    .nav-actions{
        justify-content:flex-end;
    }

    .main-container{
        width:94%;
        padding-top:20px;
    }

    .hero{
        padding:30px 22px;
        min-height:auto;
    }

    .hero h1{
        font-size:2.35rem;
        letter-spacing:-1.6px;
    }

    .hero-visual{
        transform:none;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .how-grid{
        grid-template-columns:1fr;
    }

    .audience{
        grid-template-columns:1fr;
    }

    .final-cta{
        flex-direction:column;
        align-items:flex-start;
    }

    .search-top{
        flex-direction:column;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        min-height:45px;
    }

    .my-dashboard-grid{
        grid-template-columns:1fr;
    }

    .available-functions{
        grid-template-columns:1fr;
    }

    .my-dashboard-head{
        flex-direction:column;
        align-items:flex-start;
    }

    .video-heading{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

</head>
<!DOCTYPE html>
<html lang="bs">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DocBizHub | Business Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --navy:#0b1730;
    --navy2:#12264a;
    --blue:#3155ff;
    --blue2:#6d7cff;
    --ink:#13213b;
    --muted:#667085;
    --bg:#f5f7fb;
    --card:#fff;
    --line:#e7ebf3;
    --green:#18a66b;
    --shadow:0 18px 50px rgba(20,39,76,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input{
    font:inherit;
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(11,23,48,.94);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,.1);
    padding:14px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}

.logo{
    color:#fff;
    font-weight:900;
    font-size:1.28rem;
    letter-spacing:-.4px;
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-mark{
    width:36px;
    height:36px;
    border-radius:11px;
    background:linear-gradient(135deg,#6d7cff,#3155ff);
    display:grid;
    place-items:center;
    box-shadow:0 8px 22px rgba(49,85,255,.35);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
}

.btn-nav{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    color:#fff;
    padding:9px 14px;
    border-radius:12px;
    font-weight:700;
    font-size:.86rem;
    cursor:pointer;
    transition:.2s;
}

.btn-nav:hover{
    background:rgba(255,255,255,.14);
    transform:translateY(-1px);
}

.btn-nav.primary{
    background:var(--blue);
    border-color:var(--blue);
}

.btn-nav.logout{
    background:rgba(255,255,255,.04);
}

.lang-wrapper{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border-radius:12px;
    padding:3px 9px;
}

.lang-wrapper span{
    font-size:.9rem;
}

#google_translate_element select{
    border:0;
    background:#fff;
    color:var(--ink);
    font-weight:700;
    outline:0;
    font-size:.78rem;
    padding:5px 2px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main-container{
    max-width:1240px;
    width:92%;
    margin:0 auto;
    padding:32px 0 60px;
    display:flex;
    flex-direction:column;
    gap:28px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    border-radius:30px;
    background:linear-gradient(
        120deg,
        #0b1730 0%,
        #132b56 55%,
        #294bd1 100%
    );
    color:#fff;
    padding:48px;
    min-height:430px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:35px;
    box-shadow:0 25px 65px rgba(11,23,48,.2);
}

.hero:before{
    content:"";
    position:absolute;
    width:430px;
    height:430px;
    border-radius:50%;
    right:-170px;
    top:-210px;
    background:rgba(109,124,255,.2);
    filter:blur(3px);
}

.hero:after{
    content:"";
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    left:-120px;
    bottom:-180px;
    background:rgba(49,85,255,.25);
}

.hero-content,
.hero-visual{
    position:relative;
    z-index:1;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 11px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);
    border-radius:999px;
    font-size:.76rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(2.25rem,5vw,4.35rem);
    line-height:1.02;
    letter-spacing:-2.5px;
    max-width:680px;
    margin-bottom:18px;
}

.hero h1 span{
    color:#9eabff;
}

.hero p{
    font-size:1.05rem;
    line-height:1.7;
    color:#dbe4ff;
    max-width:640px;
}

.hero-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:26px;
}

.hero-btn{
    padding:13px 18px;
    border-radius:13px;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:9px;
    border:1px solid rgba(255,255,255,.16);
    transition:.2s;
}

.hero-btn:hover{
    transform:translateY(-2px);
}

.hero-btn.primary{
    background:#fff;
    color:var(--navy);
}

.hero-btn.secondary{
    background:rgba(255,255,255,.08);
    color:#fff;
}

.user-badge{
    display:inline-flex;
    margin-top:18px;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.13);
    font-size:.78rem;
    color:#dfe6ff;
}

/* =========================================================
   HERO VISUAL
   ========================================================= */

.hero-visual{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:14px;
    box-shadow:0 20px 50px rgba(0,0,0,.18);
    transform:rotate(1deg);
}

.mock-top{
    height:28px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 4px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
}

.mock-body{
    background:#f7f9ff;
    border-radius:15px;
    padding:16px;
    color:var(--ink);
}

.mock-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
    margin-bottom:15px;
}

.mock-title{
    font-weight:900;
}

.mock-pill{
    font-size:.7rem;
    background:#e8edff;
    color:var(--blue);
    padding:6px 8px;
    border-radius:8px;
    font-weight:800;
}

.mock-grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:10px;
}

.mock-card{
    background:#fff;
    border:1px solid #edf0f6;
    border-radius:12px;
    padding:13px;
    box-shadow:0 5px 15px rgba(20,39,76,.05);
}

.mock-card strong{
    display:block;
    font-size:.95rem;
    margin-bottom:6px;
}

.mock-card small{
    color:var(--muted);
    font-size:.72rem;
}

.mock-chart{
    height:92px;
    margin-top:10px;
    display:flex;
    align-items:flex-end;
    gap:6px;
}

.bar{
    flex:1;
    background:linear-gradient(180deg,#6d7cff,#3155ff);
    border-radius:6px 6px 2px 2px;
}

.mock-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.mock-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:.74rem;
    font-weight:700;
}

.mini-icon{
    width:25px;
    height:25px;
    border-radius:8px;
    background:#eef1ff;
    display:grid;
    place-items:center;
}

/* =========================================================
   STATS
   ========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.stat{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 28px rgba(20,39,76,.05);
}

.stat strong{
    font-size:1.55rem;
    display:block;
    letter-spacing:-.5px;
}

.stat span{
    display:block;
    color:var(--muted);
    font-size:.8rem;
    margin-top:5px;
    font-weight:700;
}

.stat-icon{
    float:right;
    width:34px;
    height:34px;
    border-radius:10px;
    background:#edf1ff;
    display:grid;
    place-items:center;
}

/* =========================================================
   SECTION HEAD
   ========================================================= */

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-top:8px;
}

.section-head h2{
    font-size:1.75rem;
    letter-spacing:-.8px;
}

.section-head p{
    color:var(--muted);
    font-size:.92rem;
    margin-top:5px;
}

.section-kicker{
    font-size:.72rem;
    color:var(--blue);
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.12em;
    margin-bottom:7px;
}

/* =========================================================
   CATEGORIES
   ========================================================= */

.category{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.category-title{
    font-size:.78rem;
    font-weight:900;
    color:#667085;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.dash-tile{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:21px;
    min-height:178px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:11px;
    transition:.22s;
    box-shadow:0 8px 25px rgba(20,39,76,.045);
    cursor:pointer;
}

.dash-tile:hover{
    transform:translateY(-5px);
    border-color:#c9d1ff;
    box-shadow:0 18px 35px rgba(49,85,255,.12);
}

.tile-icon{
    width:46px;
    height:46px;
    border-radius:14px;
    background:#eef1ff;
    color:var(--blue);
    display:grid;
    place-items:center;
    font-size:1.3rem;
    font-weight:900;
}

.dash-tile h3{
    font-size:1rem;
    letter-spacing:-.2px;
}

.dash-tile p{
    font-size:.78rem;
    line-height:1.5;
    color:var(--muted);
}

.tile-arrow{
    margin-top:auto;
    color:var(--blue);
    font-size:.76rem;
    font-weight:900;
}

.admin-only{
    display:none;
}

.mail-actions{
    display:flex;
    gap:7px;
    width:100%;
    margin-top:auto;
}

.mail-btn{
    flex:1;
    padding:8px;
    border-radius:9px;
    text-align:center;
    font-size:.72rem;
    font-weight:900;
}

.mail-btn.gen{
    background:var(--blue);
    color:#fff;
}

.mail-btn.inbox{
    background:#e8f8f1;
    color:#087c4f;
}

/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

.search-section{
    background:linear-gradient(135deg,#3155ff,#6d7cff);
    color:#fff;
    border-radius:25px;
    padding:30px;
    box-shadow:0 18px 45px rgba(49,85,255,.2);
}

.search-top{
    display:flex;
    justify-content:space-between;
    align-items:start;
    gap:20px;
}

.search-section h2{
    font-size:1.55rem;
    letter-spacing:-.5px;
}

.search-section p{
    color:#e7ebff;
    font-size:.9rem;
    margin-top:5px;
}

.search-box{
    display:flex;
    gap:8px;
    background:#fff;
    padding:7px;
    border-radius:15px;
    margin-top:20px;
}

.search-box input{
    flex:1;
    border:0;
    outline:0;
    padding:12px 13px;
    color:var(--ink);
    background:transparent;
}

.search-box button{
    border:0;
    background:var(--navy);
    color:#fff;
    padding:0 18px;
    border-radius:11px;
    font-weight:800;
    cursor:pointer;
}

.quick-links{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.quick-links button{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.1);
    color:#fff;
    padding:7px 10px;
    border-radius:999px;
    font-size:.73rem;
    cursor:pointer;
}

.quick-links button:hover{
    background:rgba(255,255,255,.18);
}

#searchStatus{
    margin-top:12px;
    font-size:.82rem;
}

#searchResults{
    display:none;
    flex-direction:column;
    gap:10px;
    margin-top:13px;
}

.search-result{
    background:#fff;
    color:var(--ink);
    padding:14px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.result-left{
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.result-icon{
    font-size:1.3rem;
}

.result-title{
    font-weight:800;
    font-size:.9rem;
}

.result-description{
    font-size:.76rem;
    color:var(--muted);
    margin-top:3px;
}

.result-source{
    font-size:.68rem;
    background:#eef1ff;
    color:var(--blue);
    padding:5px 8px;
    border-radius:8px;
    font-weight:800;
}

/* =========================================================
   HOW IT WORKS
   ========================================================= */

.how-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.step{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px;
    box-shadow:0 8px 25px rgba(20,39,76,.04);
}

.step-num{
    width:34px;
    height:34px;
    border-radius:10px;
    background:var(--navy);
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:900;
    margin-bottom:16px;
}

.step h3{
    font-size:1rem;
    margin-bottom:7px;
}

.step p{
    color:var(--muted);
    font-size:.8rem;
    line-height:1.6;
}

/* =========================================================
   AUDIENCE
   ========================================================= */

.audience{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.audience-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
}

.audience-card strong{
    display:block;
    margin:11px 0 6px;
}

.audience-card p{
    font-size:.78rem;
    color:var(--muted);
    line-height:1.55;
}

.audience-icon{
    font-size:1.5rem;
}

/* =========================================================
   VIDEO
   ========================================================= */

.video-section{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px;
    box-shadow:0 8px 25px rgba(20,39,76,.04);
}

.video-heading{
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:end;

/* =========================================================
   GLOBALNA PRETRAGA
   ========================================================= */

function postaviBrzuPretragu(
    vrijednost
){

    const input =
        document.getElementById(
            'globalSearchInput'
        );


    if(!input){
        return;
    }


    input.value =
        vrijednost;


    pokreniGlobalnuPretragu();

}


function escapeHtml(
    text
){

    const div =
        document.createElement(
            'div'
        );


    div.textContent =
        String(text || '');


    return div.innerHTML;

}


async function pokreniGlobalnuPretragu(){

    const input =
        document.getElementById(
            'globalSearchInput'
        );


    const status =
        document.getElementById(
            'searchStatus'
        );


    const results =
        document.getElementById(
            'searchResults'
        );


    if(
        !input
        ||
        !status
        ||
        !results
    ){

        return;

    }


    const query =
        input.value.trim();


    if(!query){

        status.innerText =
            'Unesite pojam za pretragu.';

        results.style.display =
            'none';

        results.innerHTML =
            '';

        return;

    }


    status.innerText =
        '🔎 Pretražujem...';


    results.style.display =
        'none';

    results.innerHTML =
        '';


    try{

        const response =
            await fetch(
                SITE_SEARCH_FUNCTION_URL,
                {

                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        query:query
                    })

                }
            );


        let data =
            null;


        try{

            data =
                await response.json();

        }catch(
            jsonError
        ){

            console.warn(
                'Search JSON error:',
                jsonError
            );

        }


        const allResults =
            [];


        if(
            data
            &&
            Array.isArray(
                data.results
            )
        ){

            data.results.forEach(
                item =>
                    allResults.push(item)
            );

        }


        /* =====================================================
           GITHUB TREE
           ===================================================== */

        try{

            const githubResponse =
                await fetch(
                    GITHUB_TREE_URL
                );


            if(
                githubResponse.ok
            ){

                const githubData =
                    await githubResponse.json();


                if(
                    githubData
                    &&
                    Array.isArray(
                        githubData.tree
                    )
                ){

                    const lowerQuery =
                        query.toLowerCase();


                    githubData.tree
                        .filter(
                            item =>
                                item
                                &&
                                item.path
                                &&
                                item.path
                                    .toLowerCase()
                                    .includes(
                                        lowerQuery
                                    )
                        )
                        .slice(
                            0,
                            30
                        )
                        .forEach(
                            item => {

                                allResults.push({

                                    title:
                                        item.path,

                                    description:
                                        'GitHub resurs',

                                    url:
                                        `https://cenu1122.github.io/LANGLOVE.SITE/${item.path}`,

                                    source:
                                        'GitHub',

                                    icon:
                                        '📁'

                                });

                            }
                        );

                }

            }

        }catch(
            githubError
        ){

            console.warn(
                'GitHub search error:',
                githubError
            );

        }


        /* =====================================================
           DEDUPLICATION
           ===================================================== */

        const unique =
            [];


        const seen =
            new Set();


        allResults.forEach(
            item => {

                if(!item){
                    return;
                }


                const title =
                    String(
                        item.title
                        ||
                        item.name
                        ||
                        ''
                    );


                const url =
                    String(
                        item.url
                        ||
                        item.href
                        ||
                        ''
                    );


                const key =
                    `${title.toLowerCase()}|${url}`;


                if(
                    !seen.has(key)
                ){

                    seen.add(key);

                    unique.push(
                        item
                    );

                }

            }
        );


        if(
            unique.length === 0
        ){

            status.innerText =
                `Nema rezultata za "${query}".`;

            results.style.display =
                'none';

            return;

        }


        status.innerText =
            `Pronađeno rezultata: ${unique.length}`;


        results.innerHTML =
            unique
                .slice(
                    0,
                    50
                )
                .map(
                    item => {

                        const title =
                            escapeHtml(
                                item.title
                                ||
                                item.name
                                ||
                                'Rezultat'
                            );


                        const description =
                            escapeHtml(
                                item.description
                                ||
                                ''
                            );


                        const source =
                            escapeHtml(
                                item.source
                                ||
                                'DocBizHub'
                            );


                        const icon =
                            escapeHtml(
                                item.icon
                                ||
                                '🔎'
                            );


                        const url =
                            String(
                                item.url
                                ||
                                item.href
                                ||
                                '#'
                            );


                        return `

                            <a
                                class="search-result"
                                href="${url}">

                                <div class="result-left">

                                    <div class="result-icon">
                                        ${icon}
                                    </div>

                                    <div>

                                        <div class="result-title">
                                            ${title}
                                        </div>

                                        <div class="result-description">
                                            ${description}
                                        </div>

                                    </div>

                                </div>

                                <div class="result-source">
                                    ${source}
                                </div>

                            </a>

                        `;

                    }
                )
                .join('');


        results.style.display =
            'flex';


    }catch(error){

        console.error(
            'Global search error:',
            error
        );


        status.innerText =
            'Greška pri pretrazi. Pokušajte ponovo.';

        results.style.display =
            'none';

    }

}

            input
            &&
            event.target === input
            &&
            event.key === 'Enter'
        ){

            event.preventDefault();

            pokreniGlobalnuPretragu();

        }

    }
);

let adminNotificationChannel =
    null;


async function pokreniAdminNotifikacije(){

    if(!_supabase){
        return;
    }


    try{

        const {
            data:{
                user
            }
        } =
        await _supabase.auth.getUser();


        if(
            !user
            ||
            !user.email
            ||
            user.email.toLowerCase()
                !==
                'admin@gmail.com'
        ){

            return;

        }


        adminNotificationChannel =
            _supabase
                .channel(
                    'admin-notifikacije-kanal'
                )
                .on(

                    'postgres_changes',

                    {
                        event:'INSERT',
                        schema:'public',
                        table:'NOTIFIKACIJE'
                    },

                    function(payload){

                        prikaziAdminObavijest(
                            payload.new
                        );

                    }

                )
                .subscribe();

    }catch(error){

        console.warn(
            'Admin realtime error:',
            error
        );

    }

}


function prikaziAdminObavijest(
    data
){

    const overlay =
        document.getElementById(
            'adminNotificationOverlay'
        );


    const type =
        document.getElementById(
            'adminNotificationType'
        );


    const box =
        document.getElementById(
            'adminNotificationData'
        );


    if(!overlay){
        return;
    }


    if(type){

        type.innerText =
            data
            &&
            (
                data.TYPE
                ||
                data.TIP
                ||
                data.type
                ||
                'Nova obavijest'
            );

    }


    if(box){

        const rows =
            [];


        if(data){

            Object.keys(data)
                .forEach(
                    key => {

                        rows.push(`

                            <div class="admin-notification-row">

                                <span class="admin-notification-label">
                                    ${escapeHtml(key)}:
                                </span>

                                ${escapeHtml(
                                    data[key]
                                )}

                            </div>

                        `);

                    }
                );

        }


        box.innerHTML =
            rows.join('');

    }


    overlay.classList.add(
        'active'
    );


    try{

        const audio =
            new Audio(
                'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA='
            );


        audio.play().catch(
            () => {}
        );

    }catch(
        audioError
    ){

        console.warn(
            audioError
        );

    }

}


function zatvoriAdminObavijest(){

    const overlay =
        document.getElementById(
            'adminNotificationOverlay'
        );


    if(overlay){

        overlay.classList.remove(
            'active'
        );

    }

}

let docbizMyFunctions =
    ucitajDocBizMyFunctions();


function ucitajDocBizMyFunctions(){

    try{

        const saved =
            localStorage.getItem(
                DOCBIZ_MY_FUNCTIONS_KEY
            );


        if(!saved){

            return [
                ...DOCBIZ_DEFAULT_FUNCTIONS
            ];

        }


        const parsed =
            JSON.parse(
                saved
            );


        if(
            !Array.isArray(
                parsed
            )
        ){

            return [
                ...DOCBIZ_DEFAULT_FUNCTIONS
            ];

        }


        return parsed.filter(
            id =>
                DOCBIZ_FUNCTIONS.some(
                    item =>
                        item.id === id
                )
        );


    }catch(error){

        console.warn(
            'Moj DocBizHub:',
            error
        );


        return [
            ...DOCBIZ_DEFAULT_FUNCTIONS
        ];

    }

}


function sacuvajDocBizMyFunctions(){

    localStorage.setItem(
        DOCBIZ_MY_FUNCTIONS_KEY,
        JSON.stringify(
            docbizMyFunctions
        )
    );

}


function pronadjiDocBizFunction(
    id
){

    return DOCBIZ_FUNCTIONS.find(
        item =>
            item.id === id
    );

}


function escapeDocBizText(
    text
){

    const div =
        document.createElement(
            'div'
        );


    div.textContent =
        String(
            text || ''
        );


    return div.innerHTML;

}


function prikaziMojDocBizHub(){

    const grid =
        document.getElementById(
            'myDashboardGrid'
        );


    if(!grid){
        return;
    }


    if(
        docbizMyFunctions.length
        ===
        0
    ){

        grid.innerHTML = `

            <div class="my-empty-dashboard">

                <strong>
                    ⭐ Vaš raspored je prazan
                </strong>

                Kliknite na
                <strong>
                    Dodaj funkciju
                </strong>
                i izaberite šta želite koristiti.

            </div>

        `;

        return;

    }


    grid.innerHTML =
        docbizMyFunctions
            .map(
                (
                    id,
                    index
                ) => {

                    const item =
                        pronadjiDocBizFunction(
                            id
                        );


                    if(!item){
                        return '';
                    }


                    return `

                        <div
                            class="my-function-card"
                            draggable="true"
                            data-id="${escapeDocBizText(item.id)}">

                            <button
                                class="my-function-move"
                                onclick="pomjeriDocBizFunction(${index})"
                                title="Pomjeri">

                                ↕️

                            </button>


                            <button
                                class="my-function-remove"
                                onclick="ukloniDocBizFunction('${escapeDocBizText(item.id)}')"
                                title="Ukloni">

                                ✕

                            </button>


                            <div class="my-function-icon">
                                ${item.icon}
                            </div>


                            <h3>
                                ${escapeDocBizText(item.title)}
                            </h3>


                            <p>
                                ${escapeDocBizText(item.description)}
                            </p>


                            <a
                                href="${escapeDocBizText(item.url)}"
                                class="my-function-open">

                                Otvori →

                            </a>

                        </div>

                    `;

                }
            )
            .join('');


    aktivirajDocBizDragDrop();

}

function prikaziDostupneDocBizFunkcije(){

    const box =
        document.getElementById(
            'availableFunctions'
        );


    if(!box){
        return;
    }


    box.innerHTML =
        DOCBIZ_FUNCTIONS
            .map(
                item => {

                    const selected =
                        docbizMyFunctions
                            .includes(
                                item.id
                            );


                    return `

                        <button
                            type="button"
                            class="available-function ${selected ? 'selected' : ''}"
                            onclick="toggleDocBizFunction('${escapeDocBizText(item.id)}')">

                            <div class="available-function-icon">
                                ${item.icon}
                            </div>

                            <strong>
                                ${escapeDocBizText(item.title)}
                            </strong>

                            <small>
                                ${escapeDocBizText(item.description)}
                            </small>

                        </button>

                    `;

                }
            )
            .join('');

}


function toggleDocBizFunction(
    id
){

    const index =
        docbizMyFunctions.indexOf(
            id
        );


    if(index === -1){

        docbizMyFunctions.push(
            id
        );

    }else{

        docbizMyFunctions.splice(
            index,
            1
        );

    }


    sacuvajDocBizMyFunctions();

    prikaziMojDocBizHub();

    prikaziDostupneDocBizFunkcije();

}


function ukloniDocBizFunction(
    id
){

    docbizMyFunctions =
        docbizMyFunctions.filter(
            item =>
                item !== id
        );


    sacuvajDocBizMyFunctions();

    prikaziMojDocBizHub();

    prikaziDostupneDocBizFunkcije();

}


function pomjeriDocBizFunction(
    index
){

    if(
        index <= 0
    ){

        return;

    }


    const temp =
        docbizMyFunctions[
            index - 1
        ];


    docbizMyFunctions[
        index - 1
    ] =
        docbizMyFunctions[
            index
        ];


    docbizMyFunctions[
        index
    ] =
        temp;


    sacuvajDocBizMyFunctions();

    prikaziMojDocBizHub();

}


function resetujMojeFunkcije(){

    if(
        !confirm(
            'Želite li vratiti početni raspored funkcija?'
        )
    ){

        return;

    }


    docbizMyFunctions =
        [
            ...DOCBIZ_DEFAULT_FUNCTIONS
        ];


    sacuvajDocBizMyFunctions();

    prikaziMojDocBizHub();

    prikaziDostupneDocBizFunkcije();

}


function aktivirajDocBizDragDrop(){

    const cards =
        document.querySelectorAll(
            '.my-function-card'
        );


    cards.forEach(
        card => {

            card.addEventListener(
                'dragstart',
                function(){

                    card.classList.add(
                        'docbiz-dragging'
                    );

                }
            );


            card.addEventListener(
                'dragend',
                function(){

                    card.classList.remove(
                        'docbiz-dragging'
                    );

                }
            );


            card.addEventListener(
                'dragover',
                function(event){

                    event.preventDefault();

                }
            );


            card.addEventListener(
                'drop',
                function(event){

                    event.preventDefault();


                    const dragged =
                        document.querySelector(
                            '.docbiz-dragging'
                        );


                    if(!dragged){
                        return;
                    }


                    const fromId =
                        dragged.dataset.id;


                    const toId =
                        card.dataset.id;


                    if(
                        !fromId
                        ||
                        !toId
                        ||
                        fromId === toId
                    ){

                        return;

                    }


                    const fromIndex =
                        docbizMyFunctions
                            .indexOf(
                                fromId
                            );


                    const toIndex =
                        docbizMyFunctions
                            .indexOf(
                                toId
                            );


                    if(
                        fromIndex < 0
                        ||
                        toIndex < 0
                    ){

                        return;

                    }


                    const moved =
                        docbizMyFunctions
                            .splice(
                                fromIndex,
                                1
                            )[0];


                    docbizMyFunctions
                        .splice(
                            toIndex,
                            0,
                            moved
                        );


                    sacuvajDocBizMyFunctions();

                    prikaziMojDocBizHub();

                }
            );

        }
    );

}
